<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041412" />
      <stop offset="50%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="truckGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>
  
  <!-- Rounded Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="496" height="496" x="8" y="8" rx="120" fill="none" stroke="#10b981" stroke-width="4" stroke-opacity="0.3" />
  
  <!-- Modern Geometric Logistics Truck & Route Icon -->
  <g transform="translate(64, 88)" filter="url(#shadow)">
    <!-- Signal waves / AI pulses -->
    <path d="M 60 140 A 100 100 0 0 1 200 60" fill="none" stroke="#34d399" stroke-width="12" stroke-linecap="round" stroke-dasharray="16 20" opacity="0.8" />
    <path d="M 90 140 A 60 60 0 0 1 180 90" fill="none" stroke="#38bdf8" stroke-width="10" stroke-linecap="round" stroke-dasharray="12 16" opacity="0.9" />

    <!-- Truck Cargo Body -->
    <rect x="40" y="120" width="180" height="130" rx="16" fill="url(#truckGrad)" />
    <!-- Leaf badge inside cargo body -->
    <path d="M 130 150 C 130 150 160 150 170 175 C 180 200 155 220 130 220 C 105 220 90 195 105 170 C 120 145 130 150 130 150 Z" fill="#042f2e" opacity="0.6" />
    <path d="M 115 205 Q 135 185 155 165" stroke="#a7f3d0" stroke-width="5" stroke-linecap="round" fill="none" />

    <!-- Truck Cabin -->
    <path d="M 220 160 L 280 160 L 310 200 L 310 250 L 220 250 Z" fill="#ffffff" />
    <!-- Cabin Window -->
    <path d="M 235 172 L 275 172 L 295 200 L 235 200 Z" fill="#0f172a" />
    
    <!-- Wheels -->
    <circle cx="95" cy="255" r="32" fill="#0f172a" stroke="#10b981" stroke-width="8" />
    <circle cx="95" cy="255" r="12" fill="#e2e8f0" />
    <circle cx="265" cy="255" r="32" fill="#0f172a" stroke="#10b981" stroke-width="8" />
    <circle cx="265" cy="255" r="12" fill="#e2e8f0" />
    
    <!-- Headlight beam -->
    <path d="M 312 220 L 360 210 L 360 240 L 312 235 Z" fill="#fef08a" opacity="0.75" />
    
    <!-- Ground line -->
    <line x1="20" y1="287" x2="360" y2="287" stroke="#34d399" stroke-width="8" stroke-linecap="round" opacity="0.4" />
  </g>
</svg>
